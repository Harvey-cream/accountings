services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: account
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    # 健康检查
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 内存限制
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    build: .
    # 自动化流程：等待数据库就绪 -> 执行迁移 -> 启动后端服务
    command: >
      sh -c "
        until mysqladmin ping -h db -u root -proot --silent; do
          echo '正在等待 MySQL 数据库完全就绪...';
          sleep 2;
        done;
        echo 'MySQL 已就绪，开始检查并执行数据库迁移...';
        python manage.py makemigrations --noinput && 
        python manage.py migrate --noinput && 
        echo '数据库迁移任务执行成功！' || echo '警告：数据库迁移执行异常，请检查日志。';
        echo '正在拉起后端服务...';
        uvicorn accountsystem.asgi:application --host 0.0.0.0 --port 8899;
      "
    volumes:
      - .:/app
    ports:
      - "8010:8899"
    expose:
      - 8899
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=account
      - DB_USER=root
      - DB_PASSWORD=root
      - DEBUG=1
    # 内存限制（核心：给 Web 服务更多内存以确保构建和运行稳定）
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  celery:
    build: .
    command: celery -A accountsystem worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery-beat:
    build: .
    command: celery -A accountsystem beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf/cert:/etc/nginx/certs
      - ./nginx/conf/wx-sercret:/etc/nginx/wx-sercret
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8011:80"
      - "443:443"
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  mysql_data:
