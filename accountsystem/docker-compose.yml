services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: account
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    # 新增：健康检查，确保MySQL完全就绪
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # 替换command：等待MySQL就绪 + 全量迁移 + 启动服务
    command: >
      sh -c "
        until mysqladmin ping -h db -u root -proot --silent; do
          echo '等待MySQL就绪...';
          sleep 2;
        done;
        echo 'MySQL已就绪，执行全量迁移...';
        python manage.py makemigrations --noinput;
        python manage.py migrate --noinput;
        echo '迁移完成，启动服务...';
        uvicorn accountsystem.asgi:application --host 0.0.0.0 --port 8899;
      "
    volumes:
      - .:/app
    ports:
      - "8010:8899"
    expose:
      - 8899
    depends_on:
      # 依赖db的健康检查，确保MySQL服务就绪
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=account
      - DB_USER=root
      - DB_PASSWORD=root
      - DEBUG=1

  celery:
    build: .
    command: celery -A accountsystem worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A accountsystem beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf/cert:/etc/nginx/certs
      - ./nginx/conf/wx-sercret:/etc/nginx/wx-sercret
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8011:80"
      - "443:443"
    depends_on:
      - web

volumes:
  mysql_data:
