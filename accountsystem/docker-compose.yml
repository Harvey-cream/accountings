version: '3'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password --authentication-policy=mysql_native_password
    restart: always
    environment:
      MYSQL_DATABASE: account
      MYSQL_ROOT_PASSWORD: LuLongXiang200554
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - shared_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pLuLongXiang200554"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.0-alpine
    container_name: redis_db
    restart: always
    ports:
      - "6379:6379"
    networks:
      - shared_network

  mini_app:
    container_name: accounting
    build: .
    env_file:
      - .env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-production}
    volumes:
      - .:/app
    ports:
      - "8010:8899"
    expose:
      - 8899
    restart: always
    networks:
      - shared_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
  nginx:
    container_name: account_nginx
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/conf/wx-sercret:/etc/nginx/wx-sercret
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mini_app
    networks:
      - shared_network
  
# 网络配置
networks:
  shared_network:
    driver: bridge

volumes:
  mysql_data:
