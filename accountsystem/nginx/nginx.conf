# 开启 Gzip 压缩，提高前端加载速度
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

server {
    listen 80;
    server_name draccounting.xin www.draccounting.xin;
    
    # 将所有 HTTP 请求通过 rewrite 指令重定向到 HTTPS
    rewrite ^(.*)$ https://$host$1 permanent;
}

server {
    listen 443 ssl;
    server_name draccounting.xin www.draccounting.xin;

    # SSL 证书配置 (对应 docker-compose.yml 中的映射路径)
    ssl_certificate     /etc/nginx/certs/draccounting.xin.pem;
    ssl_certificate_key /etc/nginx/certs/draccounting.xin.key;

    # SSL 优化配置
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 限制上传文件大小
    client_max_body_size 20M;

    # 1. 优先加载前端静态文件
    location / {
        root   /app/static;          # 指向前端文件目录
        index  index.html index.htm; # 优先返回 index.html
        try_files $uri $uri/ /index.html; # 解决前端路由刷新问题
    }

    # 2. 静态文件和媒体文件
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. API 接口请求转发 (匹配 /api/ 开头的请求)
    location /api/ {
        proxy_pass http://mini_app:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 增加超时时间
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
