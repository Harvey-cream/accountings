server {
    listen 80;
    server_name localhost;

    # 1. 优先加载前端静态文件（核心修改）
    location / {
        root   /app/static;          # 指向前端文件目录
        index  index.html index.htm; # 优先返回index.html
        try_files $uri $uri/ /index.html; # 解决前端路由刷新问题
        
        # 保留WebSocket支持（你的原有配置）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 只有静态文件找不到时，才转发给后端（可选，一般用不到）
        if (!-f $request_filename) {
            proxy_pass http://web:8899;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 2. 静态文件和媒体文件（你的原有配置，保留）
    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }

    # 3. 强制指定API接口转发（可选，更稳妥）
    location /api/ {
        proxy_pass http://web:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}